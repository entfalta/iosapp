<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Newsletter - Entfalta</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">
        <img src="assets/icon.jpeg" alt="" class="brand-mark">
        <span>
          <strong>Entfalta</strong>
          <small>Newsletter</small>
        </span>
      </a>
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="index.html">Shop</a>
        <button class="user-button" id="accountButton" type="button" aria-label="Konto öffnen" title="Konto">
          <span aria-hidden="true"></span>
        </button>
      </nav>
    </header>

    <main class="newsletter-main">
      <section class="newsletter-hero">
        <h1>Newsletter</h1>
        <button id="newsletterSubscribe" type="button">Newsletter abonnieren</button>
      </section>

      <section class="panel admin-panel hidden" id="newsletterAdminPanel">
        <h2>Newsletter-Post erstellen</h2>
        <form id="newsletterForm" class="stacked-form">
          <input name="title" placeholder="Überschrift" required>
          <textarea name="text" minlength="10" placeholder="Text, mindestens 10 Zeichen" required></textarea>
          <label>
            Bild aus newsbild
            <select name="image" id="newsletterImageChoice"></select>
          </label>
          <img id="newsletterImagePreview" class="cover-preview hidden" alt="Ausgewähltes Newsletterbild">
          <button type="submit">Post veröffentlichen</button>
        </form>
      </section>

      <section id="newsletterPosts" class="newsletter-list" aria-live="polite"></section>
    </main>

    <div class="modal hidden" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="modal-content auth-modal-content">
        <button class="icon-button modal-close" id="closeAuth" type="button" aria-label="Konto schließen">X</button>
        <div id="currentUserBox" class="current-user hidden"></div>
        <form id="registerForm" class="stacked-form">
          <h2 id="authTitle">Registrieren</h2>
          <input name="name" autocomplete="name" placeholder="Name" required>
          <input name="email" type="email" autocomplete="email" placeholder="E-Mail" required>
          <input name="password" type="password" autocomplete="new-password" placeholder="Passwort" required>
          <input name="street" autocomplete="street-address" placeholder="Adresse">
          <input name="city" autocomplete="address-level2" placeholder="PLZ und Ort">
          <button type="submit">Konto erstellen</button>
        </form>
        <form id="loginForm" class="stacked-form">
          <h2>Login</h2>
          <input name="email" type="email" autocomplete="email" placeholder="E-Mail" required>
          <input name="password" type="password" autocomplete="current-password" placeholder="Passwort" required>
          <button type="submit">Einloggen</button>
          <button class="google-button" id="googleLogin" type="button">Mit Google anmelden</button>
        </form>
      </div>
    </div>

    <footer class="site-footer">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
      <a href="agb.html">AGB</a>
      <a href="kontakt.html">Kontakt</a>
    </footer>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
