<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bücher hochladen - Entfalta</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
  </head>
  <body>
    <header class="site-header">
      <img src="/assets/icon.jpeg" alt="" class="brand-mark">
      <a class="brand" href="admin.html">
        <span>
          <strong>Entfalta</strong>
          <small>Bücher hochladen</small>
        </span>
      </a>
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="admin.html">Admin</a>
        <a href="buchhaltung.html">Buchhaltung</a>
        <a href="index.html">Shop</a>
        <button class="user-button" id="accountButton" type="button" aria-label="Konto öffnen" title="Konto">
          <span aria-hidden="true"></span>
        </button>
      </nav>
    </header>

    <main class="admin-main">
      <article class="panel admin-panel hidden" id="adminPanel">
        <h1>Bücher / Artikel hochladen</h1>
        <p class="muted">Diese separate Ansicht ist nur für Admins und speichert Artikel direkt im Shop.</p>
        <form id="bookForm" class="stacked-form">
          <input type="hidden" name="id">
          <input name="title" placeholder="Titel" required>
          <textarea name="description" placeholder="Beschreibung, mindestens 10 Zeichen" minlength="10" required></textarea>
          <select name="category" required>
            <option value="Aufklärung">Aufklärung</option>
            <option value="Alltagshelfer">Alltagshelfer</option>
            <option value="Lernhelfer">Lernhelfer</option>
            <option value="Sonstige">Sonstige</option>
          </select>
          <label id="itemTypeWrap" class="hidden">
            Art
            <select name="itemType" id="itemTypeSelect">
              <option value="book">Buch</option>
              <option value="product">Produkt</option>
              <option value="worksheet">Arbeitsblätter</option>
            </select>
          </label>
          <input name="price" type="number" min="0.5" step="0.01" placeholder="Normaler Preis in EUR" required>
          <div id="variantPricesWrap" class="hidden">
            <input name="downloadPrice" type="number" min="0" step="0.01" placeholder="Download-Preis in EUR">
            <input name="printPrice" type="number" min="0" step="0.01" placeholder="Gedruckt-Preis in EUR">
          </div>
          <input name="stock" type="number" min="0" step="1" placeholder="Auf Lager" required>
          <label class="checkbox-line">
            <input name="lowStockEnabled" type="checkbox">
            Push-Benachrichtigung bei niedrigem Lager aktivieren
          </label>
          <input name="lowStockLimit" type="number" min="0" step="1" placeholder="Warnung ab z.B. 20 Stück">
          <label id="coverChoiceWrap">
            Vorderes Cover-Foto
            <select name="coverChoice" id="coverChoice" required></select>
          </label>
          <img id="coverPreview" class="cover-preview hidden" alt="Ausgewähltes Cover">
          <label id="pdfChoiceWrap" class="hidden">
            PDF
            <select name="pdfChoice" id="pdfChoice"></select>
          </label>
          <label id="previewPagesWrap" class="hidden">
            Vorschauseiten (max. 2)
            <select name="previewPages" id="previewPages" multiple size="6"></select>
          </label>
          <div id="previewPagesPreview" class="product-preview-grid hidden"></div>
          <div id="fulfillmentOptionsWrap" class="hidden">
            <label class="checkbox-line">
              <input name="downloadAvailable" type="checkbox" checked>
              Als Download anbieten
            </label>
            <label class="checkbox-line">
              <input name="printAvailable" type="checkbox" checked>
              Gedruckt anbieten
            </label>
          </div>
          <label id="productImagesWrap" class="hidden">
            Produktbilder aus Product-Ordner (max. 10)
            <select name="productImages" id="productImages" multiple size="6"></select>
          </label>
          <div id="productPreview" class="product-preview-grid hidden"></div>
          <button type="submit">Speichern</button>
          <button id="cancelEdit" type="button" class="secondary-button hidden">Bearbeitung abbrechen</button>
        </form>
        <div id="adminBookList" class="admin-list"></div>
      </article>
      <article class="panel" id="adminLoginHint">
        <h1>Admin-Zugang</h1>
        <p>Melde dich über das Konto-Symbol oben rechts an. Diese Seite ist nur für Admins.</p>
      </article>
    </main>

    <div class="modal hidden" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="modal-content auth-modal-content">
        <button class="icon-button modal-close" id="closeAuth" type="button" aria-label="Konto schließen">X</button>
        <div id="currentUserBox" class="current-user hidden"></div>
        <form id="registerForm" class="stacked-form">
          <h2 id="authTitle">Registrieren</h2>
          <input name="name" autocomplete="name" placeholder="Name" required>
          <input name="email" type="email" autocomplete="email" placeholder="E-Mail" required>
          <input name="password" type="password" autocomplete="new-password" placeholder="Passwort" required>
          <button type="submit">Konto erstellen</button>
        </form>
        <form id="loginForm" class="stacked-form">
          <h2>Login</h2>
          <input name="email" type="email" autocomplete="email" placeholder="E-Mail" required>
          <input name="password" type="password" autocomplete="current-password" placeholder="Passwort" required>
          <button type="submit">Einloggen</button>
          <button class="google-button" id="googleLogin" type="button">Mit Google anmelden</button>
        </form>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
