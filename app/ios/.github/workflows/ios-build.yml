name: Build iOS IPA (Entfalta App)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Entfalta iOS App (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build iOS Application Archive
        run: |
          if [ -d "EntfaltaApp.xcodeproj" ]; then
            PROJECT_DIR="."
          elif [ -d "app/ios/EntfaltaApp.xcodeproj" ]; then
            PROJECT_DIR="app/ios"
          else
            PROJECT_DIR=$(find . -name "EntfaltaApp.xcodeproj" | head -n 1 | xargs dirname)
          fi

          echo "Building Xcode Project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "Attempting build for generic iOS device..."
          xcodebuild -project EntfaltaApp.xcodeproj \
                     -scheme Entfalta \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     DEVELOPMENT_TEAM="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES || \
          ( \
            echo "Falling back to iOS Simulator build..." && \
            xcodebuild -project EntfaltaApp.xcodeproj \
                       -scheme Entfalta \
                       -configuration Release \
                       -sdk iphonesimulator \
                       -destination 'generic/platform=iOS Simulator' \
                       -derivedDataPath build \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGN_ENTITLEMENTS="" \
                       DEVELOPMENT_TEAM="" \
                       PROVISIONING_PROFILE_SPECIFIER="" \
                       AD_HOC_CODE_SIGNING_ALLOWED=YES \
          )

      - name: Package .ipa File
        run: |
          if [ -d "EntfaltaApp.xcodeproj" ]; then
            PROJECT_DIR="."
          elif [ -d "app/ios/EntfaltaApp.xcodeproj" ]; then
            PROJECT_DIR="app/ios"
          else
            PROJECT_DIR=$(find . -name "EntfaltaApp.xcodeproj" | head -n 1 | xargs dirname)
          fi

          cd "$PROJECT_DIR"
          APP_PATH=$(find build/Build/Products -name "Entfalta.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Fehler: Entfalta.app wurde nicht gefunden!"
            exit 1
          fi

          echo "Gefundenes App Bundle: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r EntfaltaApp.ipa Payload
          echo "IPA erfolgreich erstellt: $(pwd)/EntfaltaApp.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EntfaltaApp-iOS-Release-IPA
          path: |
            EntfaltaApp.ipa
            app/ios/EntfaltaApp.ipa
          retention-days: 30



