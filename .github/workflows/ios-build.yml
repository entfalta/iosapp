name: Build iOS App & Appetize Simulator

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Entfalta iOS App & Appetize Simulator
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build iOS Simulator App (for Appetize.io)
        run: |
          echo "Building for iOS Simulator (Appetize.io compatible)..."
          xcodebuild build -project EntfaltaApp.xcodeproj \
                     -scheme Entfalta \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     -derivedDataPath build_simulator \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     DEVELOPMENT_TEAM="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

          SIM_APP_PATH=$(find build_simulator/Build/Products -name "Entfalta.app" | head -n 1)
          if [ -n "$SIM_APP_PATH" ]; then
            echo "Found Simulator App: $SIM_APP_PATH"
            cd $(dirname "$SIM_APP_PATH")
            zip -r "$GITHUB_WORKSPACE/EntfaltaApp-Appetize-Simulator.zip" Entfalta.app
            echo "Appetize Simulator Zip created at: $GITHUB_WORKSPACE/EntfaltaApp-Appetize-Simulator.zip"
          else
            echo "Error: Simulator Entfalta.app not found!"
            exit 1
          fi

      - name: Build iOS Device IPA
        run: |
          echo "Building for generic iOS device..."
          xcodebuild build -project EntfaltaApp.xcodeproj \
                     -scheme Entfalta \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build_device \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     DEVELOPMENT_TEAM="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES || true

          DEV_APP_PATH=$(find build_device/Build/Products -name "Entfalta.app" | head -n 1)
          if [ -z "$DEV_APP_PATH" ]; then
            DEV_APP_PATH=$(find build_simulator/Build/Products -name "Entfalta.app" | head -n 1)
          fi

          if [ -n "$DEV_APP_PATH" ]; then
            echo "Packaging IPA using: $DEV_APP_PATH"
            mkdir -p Payload
            cp -r "$DEV_APP_PATH" Payload/
            zip -r "$GITHUB_WORKSPACE/EntfaltaApp.ipa" Payload
          fi

      - name: Upload Appetize Simulator Zip Artifact (for Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: EntfaltaApp-Appetize-Simulator-ZIP
          path: EntfaltaApp-Appetize-Simulator.zip
          retention-days: 30

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EntfaltaApp-iOS-Release-IPA
          path: EntfaltaApp.ipa
          retention-days: 30
