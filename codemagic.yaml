workflows:
  ios-dual-build:
    name: Build fuer echtes iPhone und Simulator
    max_build_duration: 20
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "EntfaltaApp.xcodeproj"
        XCODE_SCHEME: "EntfaltaApp"
    scripts:
      - name: 1. Bauen fuer ECHTES iPhone (Handy)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          # Verpacken als echte .ipa
          mkdir -p Payload
          APP_PATH_REAL=$(find $HOME/Library/Developer/Xcode/DerivedData -name "EntfaltaApp.app" -path "*/Build/Products/Debug-iphoneos/*" -type d | head -n 1)
          cp -r "$APP_PATH_REAL" Payload/
          zip -r fuer_echtes_iPhone.ipa Payload
          rm -rf Payload

      - name: 2. Bauen fuer ONLINE-SIMULATOR (Web)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          # Verpacken als ZIP fuer die Website
          APP_PATH_SIM=$(find $HOME/Library/Developer/Xcode/DerivedData -name "EntfaltaApp.app" -path "*/Build/Products/Debug-iphonesimulator/*" -type d | head -n 1)
          cp -r "$APP_PATH_SIM" ./EntfaltaApp.app
          zip -r fuer_online_simulator.zip EntfaltaApp.app
          rm -rf EntfaltaApp.app
    artifacts:
      - "fuer_echtes_iPhone.ipa"
      - "fuer_online_simulator.zip"
