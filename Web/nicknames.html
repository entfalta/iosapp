    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nicknames - Entfalta</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">
        <img src="/assets/icon.jpeg" alt="" class="brand-mark">
        <span><strong>Entfalta</strong><small>Nicknames</small></span>
      </a>
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="index.html">Shop</a>
        <a href="admin.html">Admin-Panel</a>
        <a href="games.html">Spiele</a>
        <button class="user-button" id="accountButton" type="button" aria-label="Konto öffnen" title="Konto">
          <span aria-hidden="true"></span>
        </button>
      </nav>
    </header>

    <main class="admin-main">
      <article class="panel admin-panel" id="nicknameAdminPanel">
        <h1>Nickname-Verwaltung</h1>
        <p id="nicknameAdminStatus" class="muted">Admin-Zugang wird geprüft...</p>
        <section class="admin-list">
          <h2>Vergebene Nicknames</h2>
          <div id="nicknameAdminList"></div>
        </section>
        <details class="admin-list">
          <summary>Blacklist</summary>
          <form id="nicknameBlacklistForm" class="stacked-form">
            <select name="type">
              <option value="word">Wort sperren</option>
              <option value="name">Exakten Namen sperren</option>
            </select>
            <input name="value" placeholder="Wort oder Nickname" required>
            <button type="submit">Zur Blacklist hinzufügen</button>
          </form>
          <div id="nicknameBlacklistList"></div>
        </details>
      </article>
    </main>

    <div class="modal hidden" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="modal-content auth-modal-content">
        <button class="icon-button modal-close" id="closeAuth" type="button" aria-label="Konto schließen">X</button>
        <div id="currentUserBox" class="current-user hidden"></div>
        <form id="registerForm" class="stacked-form">
          <h2 id="authTitle">Registrieren</h2>
          <input name="name" autocomplete="name" placeholder="Name" required>
          <input name="email" type="email" autocomplete="email" placeholder="E-Mail" required>
          <input name="password" type="password" autocomplete="new-password" placeholder="Passwort" required>
          <input name="street" autocomplete="street-address" placeholder="Adresse">
          <div class="form-two">
            <input name="zip" autocomplete="postal-code" inputmode="numeric" placeholder="PLZ">
            <input name="city" autocomplete="address-level2" placeholder="Stadt">
          </div>
          <button type="submit">Konto erstellen</button>
        </form>
        <form id="loginForm" class="stacked-form">
          <h2>Login</h2>
          <input name="email" type="email" autocomplete="email" placeholder="E-Mail" required>
          <input name="password" type="password" autocomplete="current-password" placeholder="Passwort" required>
          <button type="submit">Einloggen</button>
          <button class="google-button" id="googleLogin" type="button">Mit Google anmelden</button>
        </form>
      </div>
    </div>

    <footer class="site-footer">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
      <a href="agb.html">AGB</a>
      <a href="kontakt.html">Kontakt</a>
      <a href="newsletter.html">Newsletter</a>
      <a href="social-media.html">Social Media</a>
      <a href="games.html">Spiele</a>
    </footer>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script src="games/app.js"></script>
  </body>
</html>
