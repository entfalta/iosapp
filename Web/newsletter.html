    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Newsletter - Entfalta</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" href="/favicon.png">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/index.html">
        <img src="/assets/icon.jpeg" alt="" class="brand-mark">
        <span>
          <strong>Entfalta</strong>
          <small>Newsletter</small>
        </span>
      </a>
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="/index.html">Shop</a>
        <a href="/games.html">Spiele</a>
        <button class="user-button" id="accountButton" type="button" aria-label="Konto öffnen" title="Konto">
          <span aria-hidden="true"></span>
        </button>
      </nav>
    </header>

    <main class="newsletter-main">
      <section class="newsletter-hero">
        <h1>Newsletter</h1>
        <div id="subscriptionForm" class="panel subscription-panel">
            <p>Bleib auf dem Laufenden und wähle, ob du bei neuen Beiträgen eine Browser-Benachrichtigung erhalten möchtest.</p>
            <div class="stacked-form">
                <label class="checkbox-line">
                    <input id="pushToggle" type="checkbox">
                    <span>Browser-Push aktivieren</span>
                </label>
                <button id="newsletterSubscribe" type="button">Speichern & Abonnieren</button>
            </div>
        </div>
      </section>

      <section class="panel admin-panel hidden" id="newsletterAdminPanel">
        <div class="summary-grid" style="margin-bottom: 20px;">
            <div><strong id="subscriberCount">0</strong><span>Abonnenten</span></div>
        </div>

        <h2>Newsletter-Post erstellen</h2>
        <form id="newsletterForm" class="stacked-form">
          <input name="title" placeholder="Überschrift" required>
          <textarea name="text" minlength="10" placeholder="Text, mindestens 10 Zeichen" required></textarea>
          <label>
            Bild hinzufügen
            <select name="image" id="newsletterImageChoice"></select>
          </label>
          <label class="profile-file-label">
            Eigenes Bild hochladen
            <span class="profile-file-picker">
              <input name="uploadedImage" id="newsletterImageUpload" type="file" accept="image/*">
              <span class="profile-file-button">Bild auswählen</span>
              <span class="profile-file-name">Keine Datei ausgewählt</span>
            </span>
          </label>
          <img id="newsletterImagePreview" class="cover-preview hidden" alt="Ausgewähltes Newsletterbild">
          <button type="submit">Post veröffentlichen</button>
        </form>
      </section>

      <section id="newsletterPosts" class="newsletter-list" aria-live="polite"></section>
    </main>

    <div class="modal hidden" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="modal-content auth-modal-content">
        <button class="icon-button modal-close" id="closeAuth" type="button" aria-label="Konto schließen">X</button>
        <div id="currentUserBox" class="current-user hidden"></div>
        <form id="registerForm" class="stacked-form">
          <h2 id="authTitle">Registrieren</h2>
          <input name="name" autocomplete="name" placeholder="Name" required>
          <input name="email" type="email" autocomplete="email" placeholder="E-Mail" required>
          <input name="password" type="password" autocomplete="new-password" placeholder="Passwort" required>
          <input name="street" autocomplete="street-address" placeholder="Adresse">
          <div class="form-two">
            <input name="zip" autocomplete="postal-code" inputmode="numeric" placeholder="PLZ">
            <input name="city" autocomplete="address-level2" placeholder="Stadt">
          </div>
          <button type="submit">Konto erstellen</button>
        </form>
        <form id="loginForm" class="stacked-form">
          <h2>Login</h2>
          <input name="email" type="email" autocomplete="email" placeholder="E-Mail" required>
          <input name="password" type="password" autocomplete="current-password" placeholder="Passwort" required>
          <button type="submit">Einloggen</button>
          <button class="google-button" id="googleLogin" type="button">Mit Google anmelden</button>
        </form>
      </div>
    </div>
    <footer class="site-footer">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
      <a href="agb.html">AGB</a>
      <a href="kontakt.html">Kontakt</a>
      <a href="newsletter.html">Newsletter</a>
      <a href="social-media.html">Social Media</a>
      <a href="games.html">Spiele</a>
    </footer>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/app.js"></script>
    <script src="games/app.js"></script>
  </body>
</html>
