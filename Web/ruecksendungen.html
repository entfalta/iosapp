<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rücksendung beantragen - Entfalta</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
  </head>
  <body class="design-modern">
    <header class="site-header">
      <a class="brand" href="index.html">
        <img src="assets/icon.jpeg" alt="" class="brand-mark">
        <span><strong>Entfalta</strong><small>Rücksendung</small></span>
      </a>
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="index.html">Shop</a>
        <button class="user-button" id="accountButton" type="button" aria-label="Konto öffnen" title="Konto">
          <span aria-hidden="true"></span>
        </button>
      </nav>
    </header>

    <main class="admin-main">
      <article class="panel">
        <h1>Rücksendung beantragen</h1>
        <p class="muted">Prüfe deine Bestellung und starte deine Retoure hier selbstständig. Du kannst auch ohne Konto zurücksenden.</p>

        <form id="returnLookupForm" class="stacked-form">
          <input name="orderNumber" placeholder="Bestellnummer (z.B. BE-1234)">
          <div class="form-two">
            <input name="email" type="email" placeholder="E-Mail Adresse">
            <input name="zip" inputmode="numeric" placeholder="PLZ">
          </div>
          <button type="submit">Bestellung prüfen</button>
        </form>

        <div id="returnLookupStatus" class="auth-message hidden"></div>

        <section id="returnOrderSelection" class="hidden" style="margin-top: 24px;">
          <h2>Bestellung gefunden</h2>
          <div id="returnOrderSummary" class="panel" style="padding: 20px; margin-bottom: 20px;"></div>

          <div id="returnItemsContainer" style="margin-top: 20px;"></div>

          <div style="margin-top: 24px;">
            <h3>Versandmethode für die Retoure</h3>
            <div id="returnShippingMethods" class="form-two" style="gap: 12px;"></div>
          </div>

          <div style="margin-top: 20px;">
            <button id="createReturnBtn" type="button" class="primary-link">Retoure erstellen</button>
          </div>
        </section>

        <section id="returnResultSection" class="hidden" style="margin-top: 30px;">
          <div class="auth-message is-success">Retoure erfolgreich erstellt</div>
          <div id="returnResultContent" class="panel" style="padding: 20px;"></div>
        </section>
      </article>
    </main>

    <footer class="site-footer">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
      <a href="agb.html">AGB</a>
      <a href="kontakt.html">Kontakt</a>
      <a href="gutschein.html">Gutscheine</a>
    </footer>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
