    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gutschein-Codes - Entfalta</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="admin.html">
        <img src="assets/icon.jpeg" alt="" class="brand-mark">
        <span><strong>Entfalta</strong><small>Codes</small></span>
      </a>
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="admin.html">Admin-Panel</a>
        <a href="gutschein-admin.html">Gutscheine</a>
        <button class="user-button" id="accountButton" type="button" aria-label="Konto öffnen" title="Konto">
          <span aria-hidden="true"></span>
        </button>
      </nav>
    </header>

    <main class="admin-main">
      <article class="panel admin-panel hidden" id="adminPanel">
        <h1>Gutschein-Codes</h1>
        <form id="giftVoucherCleanupForm" class="stacked-form">
          <label>
            Leere Gutscheine nach Tagen löschen
            <input name="days" type="number" min="1" max="1095" step="1" placeholder="z.B. 30">
          </label>
          <button type="submit">Löschfrist speichern</button>
        </form>
        <div class="segmented-control" id="giftVoucherCodeFilter">
          <button type="button" data-gift-voucher-filter="all" class="active">Alle</button>
          <button type="button" data-gift-voucher-filter="active">Aktiv</button>
          <button type="button" data-gift-voucher-filter="empty">Leer</button>
        </div>
        <p class="muted filter-status" id="giftVoucherCodeFilterStatus">Aktuelle Kategorie: Alle</p>
        <div id="giftVoucherCodeList" class="admin-list"></div>
      </article>

      <article class="panel" id="adminLoginHint">
        <h1>Admin-Zugang nötig</h1>
        <p>Melde dich mit einem Admin-Konto an, um Gutschein-Codes zu sehen.</p>
      </article>
    </main>

    <div class="modal hidden" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="modal-content auth-modal-content">
        <button class="icon-button modal-close" id="closeAuth" type="button" aria-label="Konto schließen">X</button>
        <div id="currentUserBox" class="current-user hidden"></div>
        <form id="registerForm" class="stacked-form">
          <h2 id="authTitle">Registrieren</h2>
          <input name="name" autocomplete="name" placeholder="Name" required>
          <input name="email" type="email" autocomplete="email" placeholder="E-Mail" required>
          <input name="password" type="password" autocomplete="new-password" placeholder="Passwort" required>
          <button type="submit">Konto erstellen</button>
        </form>
        <form id="loginForm" class="stacked-form">
          <h2>Login</h2>
          <input name="email" type="email" autocomplete="email" placeholder="E-Mail" required>
          <input name="password" type="password" autocomplete="current-password" placeholder="Passwort" required>
          <button type="submit">Einloggen</button>
          <button class="google-button" id="googleLogin" type="button">Mit Google anmelden</button>
        </form>
      </div>
    </div>

    <footer class="site-footer">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
      <a href="agb.html">AGB</a>
      <a href="kontakt.html">Kontakt</a>
      <a href="newsletter.html">Newsletter</a>
      <a href="social-media.html">Social Media</a>
      <a href="games.html">Spiele</a>
      <a href="gutschein.html">Gutscheine</a>
    </footer>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script src="games/app.js"></script>
  </body>
</html>
