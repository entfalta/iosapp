<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Support - Entfalta</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">
        <img src="/assets/icon.jpeg" alt="" class="brand-mark">
        <span>
          <strong>Entfalta</strong>
          <small>Support</small>
        </span>
      </a>
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="index.html">Shop</a>
        <a href="newsletter.html">Newsletter</a>
        <button class="user-button" id="accountButton" type="button" aria-label="Konto öffnen" title="Konto">
          <span aria-hidden="true"></span>
        </button>
      </nav>
    </header>

    <main class="admin-main support-page">
      <article class="panel">
        <h1>Support</h1>
        <p id="supportAvailability" class="muted">Support wird geladen...</p>

        <section id="supportAdminPanel" class="support-admin-panel hidden">
          <h2>Support-Team</h2>
          <label>
            Mein Status
            <select id="supportPresenceSelect">
              <option value="present">Anwesend</option>
              <option value="standby">In Bereitschaft</option>
              <option value="away">Abwesend</option>
            </select>
          </label>
          <label class="checkbox-row">
            <input id="supportNotificationsToggle" type="checkbox">
            Support-Nachrichten als Browser-Benachrichtigung anzeigen
          </label>
          <div class="admin-actions">
            <button type="button" id="toggleSupportArchive">Archivierte Fälle anzeigen</button>
          </div>
          <div id="supportChatList" class="admin-list"></div>
        </section>

        <section class="support-chat-panel">
          <h2>Chat</h2>
          <div id="supportMessages" class="support-messages"></div>
          <p id="supportTyping" class="muted support-typing hidden">Jemand schreibt<span>.</span><span>.</span><span>.</span></p>
          <form id="supportChatForm" class="support-chat-form">
            <textarea name="message" rows="3" placeholder="Nachricht schreiben..." required></textarea>
            <div class="admin-actions">
              <button type="submit">Senden</button>
              <button type="button" id="closeSupportChat">Chat beenden</button>
            </div>
          </form>
        </section>
      </article>
    </main>

    <div class="modal hidden" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="modal-content auth-modal-content">
        <button class="icon-button modal-close" id="closeAuth" type="button" aria-label="Konto schließen">X</button>
        <div id="currentUserBox" class="current-user hidden"></div>
        <form id="registerForm" class="stacked-form">
          <h2 id="authTitle">Registrieren</h2>
          <input name="name" autocomplete="name" placeholder="Name" required>
          <input name="email" type="email" autocomplete="email" placeholder="E-Mail" required>
          <input name="password" type="password" autocomplete="new-password" placeholder="Passwort" required>
          <button type="submit">Konto erstellen</button>
        </form>
        <form id="loginForm" class="stacked-form">
          <h2>Login</h2>
          <input name="email" type="email" autocomplete="email" placeholder="E-Mail" required>
          <input name="password" type="password" autocomplete="current-password" placeholder="Passwort" required>
          <button type="submit">Einloggen</button>
          <button class="google-button" id="googleLogin" type="button">Mit Google anmelden</button>
        </form>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
